<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Arsen Aldea Site - Redirecting</title>
    <script type="text/javascript">
      var segmentCount = 1;

      var l = window.location;
      var newPath = l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/';
      var a = document.createElement('a');
      a.href = l.href;
      
      
      a.pathname = newPath;
      a.search = '?' + [
        'p=' + l.pathname.slice(newPath.length).replace(/&/g, '~and~'),
        'q=' + l.search.slice(1).replace(/&/g, '~and~'),
        'h=' + l.hash.slice(1)
      ].join('&');

      l.replace(a.href);
    </script>
  </head>
  <body>
  </body>
</html>

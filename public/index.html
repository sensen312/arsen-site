    <!-- SPA Redirect script for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p) {
            var newPath = q.p;
            var newSearch = q.q ? '?' + q.q : '';
            var newHash = q.h ? '#' + q.h : '';
            window.history.replaceState(null, null, newPath + newSearch + newHash);
          }
        }
      }(window.location))
    </script>

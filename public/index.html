        <script type="text/javascript">
      (function(l) {
        // Check if the URL has a query string.
        if (l.search) {
          var q = {};
          // Parse the query string into an object.
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            if (a[0]) {
              q[decodeURIComponent(a[0])] = decodeURIComponent(a.slice(1).join('='));
            }
          });
          // If the 'p' parameter exists (from the 404 redirect).
          if (q.p) {
            // Reconstruct the full, correct URL.
            var newPath = q.p;
            var newSearch = q.q ? '?' + q.q : '';
            var newHash = q.h ? '#' + q.h : '';
            // Use the History API to update the URL in the browser bar
            // without reloading the page. React Router will then read this
            // correct path and render the appropriate component.
            window.history.replaceState(null, null, newPath + newSearch + newHash);
          }
        }
      }(window.location))
    </script>
